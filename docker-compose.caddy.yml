# Caddy override — use instead of docker-compose.prod.yml's nginx service
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.caddy.yml up -d
#
# Differences vs prod overlay:
#   - Caddy reaches services over the mep_db_default network by container name,
#     so host ports are bound to 127.0.0.1 only (not reachable from the internet)
#   - !override is required: compose merges port lists across files otherwise
#   - nginx service is NOT included (Caddy handles routing + TLS)

services:
  postgres:
    ports: !override
      - "127.0.0.1:5432:5432"

  backend:
    ports: !override
      - "127.0.0.1:8000:8000"

  frontend:
    ports: !override
      - "127.0.0.1:5173:5173"

  admin:
    ports: !override
      - "127.0.0.1:5174:5174"
